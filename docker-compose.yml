services:
  # ─── Microservicios del Sistema de Coworking ─────────────────
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service
    ports:
      - "8001:8001"
    networks:
      - coworking-network
    restart: unless-stopped

  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    container_name: orders-service
    ports:
      - "8002:8002"
    environment:
      - CATALOG_SERVICE_URL=http://catalog-service:8001
      - ANALYTICS_SERVICE_URL=http://analytics-service:8003
      - DATABASE_URL=postgresql+psycopg2://postgres:Coworking2026!@coworking-orders-db.clams6woe8i0.us-east-2.rds.amazonaws.com:5432/coworking_orders
    depends_on:
      - catalog-service
    networks:
      - coworking-network
    restart: unless-stopped

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    ports:
      - "8003:8003"
    environment:
      - MONGO_URI=mongodb+srv://darodriguez23_db_user:qozDZuxtNezQqmbi@cluster0.l6yqrfd.mongodb.net/coworking_analytics?retryWrites=true&w=majority
      - MONGO_DB_NAME=coworking_analytics
    networks:
      - coworking-network
    restart: unless-stopped

networks:
  coworking-network:
    name: coworking-network
    driver: bridge
